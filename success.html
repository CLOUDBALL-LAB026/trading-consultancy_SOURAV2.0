<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Received | SOURAV SARKAR</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0B0F19; }
        /* This makes the receipt look clean and white when downloaded as a PDF */
        @media print {
            body { background-color: white !important; color: black !important; }
            .no-print { display: none !important; }
            .print-text-black { color: black !important; }
            .print-border { border-color: #e2e8f0 !important; }
        }
    </style>
</head>
<body class="text-slate-200 font-sans antialiased min-h-screen flex items-center justify-center p-6">

    <div class="max-w-xl w-full bg-[#111625] border border-slate-800 p-8 md:p-12 rounded-2xl shadow-2xl print-border text-center">
        
        <div class="w-16 h-16 bg-emerald-500/10 rounded-full flex items-center justify-center mx-auto mb-6 no-print">
            <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>

        <h1 class="text-3xl font-bold text-white mb-2 print-text-black">Application Received</h1>
        <p class="text-slate-400 mb-8 print-text-black text-sm">Your transaction ID has been submitted for manual verification. Our team will contact you within 24 hours.</p>
        
        <!-- Receipt Details -->
        <div class="text-left bg-[#0B0F19] border border-slate-800 p-6 rounded-xl mb-8 print-border">
            <h2 class="text-sm font-bold tracking-widest text-emerald-400 uppercase mb-5 print-text-black">Provisional Receipt</h2>
            
            <div class="space-y-4 text-sm">
                <div class="flex justify-between border-b border-slate-800 pb-3 print-border">
                    <span class="text-slate-500 print-text-black">Payee:</span>
                    <span class="font-bold text-white print-text-black text-right">SOURAV SARKAR Consulting</span>
                </div>
                <div class="flex justify-between border-b border-slate-800 pb-3 print-border">
                    <span class="text-slate-500 print-text-black">Client Name:</span>
                    <span class="font-medium text-slate-200 print-text-black text-right" id="display-name">-</span>
                </div>
                <div class="flex justify-between border-b border-slate-800 pb-3 print-border">
                    <span class="text-slate-500 print-text-black">Service Selected:</span>
                    <span class="font-medium text-slate-200 print-text-black text-right max-w-[60%]" id="display-service">-</span>
                </div>
                <div class="flex justify-between border-b border-slate-800 pb-3 print-border">
                    <span class="text-slate-500 print-text-black">Transaction UTR:</span>
                    <span class="font-mono text-slate-200 print-text-black text-right" id="display-utr">-</span>
                </div>
                <div class="flex justify-between border-b border-slate-800 pb-3 print-border">
                    <span class="text-slate-500 print-text-black">Date:</span>
                    <span class="font-medium text-slate-200 print-text-black text-right" id="display-date"></span>
                </div>
                <div class="flex justify-between pt-1">
                    <span class="text-slate-500 print-text-black">Status:</span>
                    <span class="font-bold text-emerald-400 print-text-black text-right">Pending Verification</span>
                </div>
            </div>
        </div>

        <!-- Action Buttons (Hidden when printed/downloaded) -->
        <div class="space-y-4 no-print">
            <button onclick="window.print()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl text-sm transition-all shadow-md">
                Download / Print Receipt
            </button>
            <a href="index.html" class="block w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-3.5 rounded-xl text-sm transition-all text-center">
                Return to Homepage
            </a>
        </div>
    </div>

    <!-- JavaScript to load the saved form data onto the receipt -->
    <script>
        // Inject today's date
        document.getElementById('display-date').innerText = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        
        // Pull data from browser memory (localStorage)
        const savedName = localStorage.getItem('savedName');
        const savedService = localStorage.getItem('savedService');
        const savedUTR = localStorage.getItem('savedUTR');
        
        // If the data exists, display it. If not (e.g. they refreshed the page), show fallback text.
        document.getElementById('display-name').innerText = savedName ? savedName : "Not Provided";
        document.getElementById('display-service').innerText = savedService ? savedService : "Consulting Service";
        document.getElementById('display-utr').innerText = savedUTR ? savedUTR : "Pending";
    </script>
</body>
</html>
