<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal Login | SOURAV SARKAR</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0B0F19; }
        .glow-effect { box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="text-slate-200 font-sans antialiased min-h-screen flex flex-col selection:bg-emerald-500 selection:text-black">

    <!-- Minimal Header -->
    <header class="w-full absolute top-0 left-0 z-50 p-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold tracking-tight text-white hover:opacity-80 transition-opacity">
                SOURAV<span class="text-emerald-400 font-light">SARKAR</span>
            </a>
            <a href="index.html" class="text-sm font-medium text-slate-400 hover:text-white transition-colors flex items-center gap-2">
                ← Back to Homepage
            </a>
        </div>
    </header>

    <!-- Login Container -->
    <main class="flex-1 flex items-center justify-center p-6 relative">
        <!-- Ambient Background Glow -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-emerald-500/10 blur-[100px] rounded-full pointer-events-none"></div>

        <div class="max-w-md w-full bg-[#111625] border border-slate-800/80 p-8 md:p-10 rounded-2xl shadow-2xl relative z-10">
            
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-white tracking-tight mb-2">Client Portal</h1>
                <p class="text-sm text-slate-400">Enter your credentials to check your application status and access institutional reports.</p>
            </div>

            <!-- Login Form (Currently a static mockup) -->
            <form class="space-y-5" onsubmit="event.preventDefault(); alert('Backend database connection required to authenticate users.');">
                
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email Address</label>
                    <input type="email" required placeholder="client@example.com" class="w-full bg-[#0B0F19] border border-slate-800 focus:border-emerald-500/50 rounded-xl px-4 py-3 text-white text-sm outline-none transition-colors">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Application ID / Password</label>
                        <a href="#" class="text-xs text-emerald-400 hover:text-emerald-300">Forgot ID?</a>
                    </div>
                    <input type="password" required placeholder="e.g., INV-A1B2C3" class="w-full bg-[#0B0F19] border border-slate-800 focus:border-emerald-500/50 rounded-xl px-4 py-3 text-white text-sm outline-none transition-colors">
                </div>

                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl text-sm transition-all duration-200 shadow-md mt-2 glow-effect">
                    Access Dashboard
                </button>

            </form>

            <div class="mt-8 pt-6 border-t border-slate-800 text-center">
                <p class="text-xs text-slate-500">
                    Don't have an account? <a href="index.html#contact" class="text-emerald-400 hover:text-emerald-300 font-medium">Apply for a consultation</a>
                </p>
            </div>
        </div>
    </main>

</body>
</html>
